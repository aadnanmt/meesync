name: Remote meesync
on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

concurrency:
  group: meesync
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PUBLIC_PROFILE_REPO: ${{ vars.PUBLIC_PROFILE_REPO }}
      GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
      GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME }}
    steps:
      - name: checkout private build
        uses: actions/checkout@v4

      - name: checkout public profile
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PUBLIC_PROFILE_REPO }}
          token: ${{ secrets.GH_TOKEN }}
          path: public-repo

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: generate & format
        run: |
          deno run -A scripts/index.ts ./public-repo/README.md ./public-repo/stats.json
          deno fmt public-repo/README.md public-repo/stats.json
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: check for changes
        id: changes
        run: |
          # README.md, stats.svg and stats.json written to public-repo/.
          # The outer repo is not changed.
          # "status" also sees files that are not in git yet.
          if [ -z "$(git -C public-repo status --porcelain)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: push to public repo
        if: steps.changes.outputs.changed == 'true'
        working-directory: ./public-repo
        run: |
          git config --local user.email "${{ env.GIT_AUTHOR_EMAIL }}"
          git config --local user.name "${{ env.GIT_AUTHOR_NAME }}"
          git add README.md stats.svg stats.json
          git commit -m "docs: sync automated README + stats" || exit 0
          git push origin HEAD
