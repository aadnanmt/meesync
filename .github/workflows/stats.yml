name: Remote readmeSync
on:
  schedule:
    - cron: '17 5,17 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout private build
        uses: actions/checkout@v4

      - name: checkout public profile
        uses: actions/checkout@v4
        with:
          repository: aadnanmt/aadnanmt
          token: ${{ secrets.GH_TOKEN }}
          path: public-repo

      - uses: denoland/setup-deno@v2

      - name: cache deps
        run: deno install

      - name: install & generate
        run: |
          deno run -A scripts/index.ts ./public-repo/README.md ./stats.json
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: format generated files
        run: deno fmt public-repo/README.md stats.json

      - name: push to public repo
        working-directory: ./public-repo
        run: |
          git config --local user.email "adnan@nanoolabs.dev"
          git config --local user.name "Adnan Slamet Wibowo"
          git add README.md
          git commit -m "docs: sync automated README.md [skip ci]" || exit 0
          git push origin HEAD

      - name: push stats to this repo
        run: |
          git config --local user.email "adnan@nanoolabs.dev"
          git config --local user.name "Adnan Slamet Wibowo"
          git add stats.json
          git commit -m "data: update stats.json for portfolio [skip ci]" || exit 0
          git push origin HEAD
